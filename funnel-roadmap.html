<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account One · Funnel &amp; Roadmap</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%2328368D%22/><text x=%2250%22 y=%2266%22 font-size=%2258%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22>A1</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"></div>
      <div class="brand-text">
        <div class="eyebrow">Portal de campañas</div>
        <h1>Account<span class="one">One</span></h1>
      </div>
    </div>
    <div class="meta">
      <div id="live-badge-wrap"><span class="live-badge snapshot"><span class="dot"></span>Cargando…</span></div>
      <span class="updated" id="updated-at"></span>
      Gestionado por Michelle Dijool — Automatización Digital
    </div>
  </header>

  <nav class="tabs">
    <a href="index.html">Dashboard</a>
    <a href="campanas.html">Campañas</a>
    <a href="funnel-roadmap.html">Funnel &amp; Roadmap</a>
    <a href="historico.html">Histórico</a>
  </nav>

  <section class="panel">
    <h2 class="section-title"><span class="ti" data-icon="plug"></span>Estado del <em>funnel</em> / GHL</h2>
    <div id="funnel-status"><div class="loading">Verificando conexión…</div></div>

    <h2 class="section-title" style="margin-top:32px;"><span class="ti" data-icon="route"></span><em>Road</em>map</h2>
    <div id="roadmap" class="roadmap-grid"><div class="loading">Cargando…</div></div>
  </section>

  <footer>
    <span>Cuenta publicitaria: Account One (677439744786765) · Meta Ads</span>
    <span id="footer-mode">—</span>
  </footer>
</div>

<script src="common.js"></script>
<script>
  const VISIBLE_ITEMS = 3;

  function roadmapCard(cls, ico, title, items) {
    if (!items || !items.length) return '';
    const lis = items.map((i, idx) => `<li${idx >= VISIBLE_ITEMS ? ' class="more"' : ''}>${i}</li>`).join('');
    const extra = items.length - VISIBLE_ITEMS;
    return `
      <div class="roadmap-card ${cls}">
        <h3><span class="roadmap-icon">${icon(ico, 16)}</span>${title}<span class="count">${items.length}</span></h3>
        <ul>${lis}</ul>
        ${extra > 0 ? `<button type="button" class="roadmap-toggle" onclick="toggleRoadmap(this)" data-extra="${extra}">Ver ${extra} más</button>` : ''}
      </div>`;
  }

  function toggleRoadmap(btn) {
    const card = btn.closest('.roadmap-card');
    const open = card.classList.toggle('expanded');
    btn.textContent = open ? 'Ver menos' : 'Ver ' + btn.dataset.extra + ' más';
  }
  window.toggleRoadmap = toggleRoadmap;

  function renderRoadmap(data) {
    const r = data.roadmap;
    if (!r) { document.getElementById('roadmap').innerHTML = ''; return; }
    document.getElementById('roadmap').innerHTML =
      roadmapCard('pendientes', 'alert', 'Pendientes', r.pendientes) +
      roadmapCard('completado', 'check', 'Hecho esta semana', r.completado ? r.completado.slice().reverse() : r.completado) +
      roadmapCard('pasos', 'arrow', 'Próximos pasos', r.proximos_pasos) +
      roadmapCard('artes', 'pen', 'Próximas artes de campañas', r.proximas_artes);
  }

  async function loadRoadmap() {
    try {
      const res = await fetch('/api/campaigns');
      const data = await res.json();
      renderLiveBadge(data.modo, data.actualizado);
      renderRoadmap(data);
    } catch (e) {
      document.getElementById('roadmap').innerHTML = `<div class="loading">No se pudo cargar (${e.message}).</div>`;
    }
  }

  async function loadFunnel() {
    try {
      const res = await fetch('/api/funnel');
      const data = await res.json();
      const cls = data.estado === 'conectado' ? 'ok' : (data.estado === 'error' ? 'error' : 'pending');
      const title = data.estado === 'conectado' ? 'GHL conectado' : (data.estado === 'error' ? 'Error de conexión' : 'GHL no conectado todavía');
      document.getElementById('funnel-status').innerHTML = `
        <div class="status-card">
          <div class="status-dot ${cls}"></div>
          <div class="msg"><strong>${title}</strong><span>${data.mensaje}</span></div>
        </div>
      `;
    } catch (e) {
      document.getElementById('funnel-status').innerHTML = `<div class="loading">No se pudo verificar (${e.message}).</div>`;
    }
  }

  loadRoadmap();
  loadFunnel();
</script>
</body>
</html>
